<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Mochi Pink</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffe6f0;
      color: #333;
      text-align: center;
    }

    header {
      background-color: #ff99cc;
      color: white;
      padding: 0px 30px;
    }

    header h1 {
      font-size: 2.5em;
      font-style: italic;
    }

    header p {
      font-size: 1.2em;
      margin: 15px 0;
    }

    .cta-button {
      background-color: #ff6699;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 15px;
      font-size: 1.2em;
      transition: background-color 0.3s;
      box-shadow: 0 0 1rem gray;
    }

    .cta-button:hover {
      background-color: #e65587;
    }

    .about {
      background-color: #fff;
      color: #666;
      padding: 30px 20px;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 0 1rem gray;
    }

    .product-item {
      overflow: hidden;
      text-align: center;
    }

    .product-item img {
      width: 200px;
      height: 200px;
      display: block;
      margin: auto;
      box-shadow: 0 0 1rem gray;
    }

    .about h2 {
      color: #ff6699;
      margin-bottom: 15px;
    }

    .about p {
      font-size: 1em;
      line-height: 1.6;
    }

    .navbar {
      text-align: left;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="navbar">
    <a href="index.html">
      <img src="https://imverse.my.id/public_html/mochi.png" alt="Home" width="40" height="40">
    </a>
  </div>

  <header>
    <div class="product-item">
      <h1>PINKY MOCHI</h1>
      <p>Lezatnya mochi dengan berbagai pilihan rasa!</p>
      <br>
      <img src="etalase_mochi.jpg" alt="Mochi Etalase" width="200" height="200">
      <a href="cihuy.html" class="cta-button">Lihat Produk</a>
    </div>
  </header>

  <section class="about">
    <h2>Tentang Kami</h2>
    <p>Pinky mochi menawarkan mochi buatan tangan dengan bahan berkualitas dan berbagai varian rasa yang unik.
      Kami berdedikasi untuk menyediakan mochi terbaik dengan sentuhan rasa yang tak terlupakan.</p>
  </section>

</body>

</html>
