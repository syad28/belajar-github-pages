<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="navbar">
        <a img src="https://imverse.my.id/public_html/mochi.png" alt="Home" width="20" height="20"></a>

    </div>
    <title>Toko Mochi Pink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            color: #333;
            text-align: center;
        }

        header {
            background-color: #ff99cc;
            color: white;
            padding: 0px 30px;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        header h1 {
            font-size: 2.5em;
            font-style: italic;
        }

        header p {
            font-size: 1.2em;
            margin: 15px 0;
        }

        .cta-button {
            background-color: #ff6699;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2em;
            transition: background-color 0.3s;
            box-shadow: 0 0 1rem gray;
        }

        .cta-button:hover {
            background-color: #e65587;
            box-shadow: 0 0 1rem gray;
        }

        .about {
            background-color: #fff;
            color: #666;
            padding: 30px 20px;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 0 1rem gray;
        }

        .product-item {

            border: 0px solid pink;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
            text-align: center;
        }

        .product-item img {
            width: 200px;
            height: 200px;
            display: block;
            margin: auto;
            box-shadow: 0 0 1rem gray;
        }

        .about h2 {
            color: #ff6699;
            margin-bottom: 15px;
        }

        .about p {
            font-size: 1em;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <header>
        <div class="product-item">
            <h1>PINKY MOCHI</h1>
            <p>Lezatnya mochi dengan berbagai pilihan rasa!</p>
            <br>

            <img src="etalase_mochi.jpg" height="20" width="20">
            <a href="cihuy.html" class="cta-button">Lihat Produk</a>
        </div>
    </header>

    <section class="about">
        <h2>Tentang Kami</h2>
        <p>Pinky mochi menawarkan mochi buatan tangan dengan bahan berkualitas dan berbagai varian rasa yang unik.
            Kami berdedikasi untuk menyediakan mochi terbaik dengan sentuhan rasa yang tak terlupakan.</p>

    </section>
</body>

</html>
